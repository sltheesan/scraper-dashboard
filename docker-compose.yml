# Production runtime composition for the Scraper Dashboard.
# Lives on the VPS at /root/scraper-app/docker-compose.yml.
# The VPS only ever runs `docker compose pull && up -d` — it never builds.
#
# MongoDB is NOT a container here — it runs on the host (apt-installed,
# systemd-managed). The app reaches it at host.docker.internal:27017.

services:
  app:
    image: ghcr.io/sltheesan/scraper-dashboard:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      # Maps host.docker.internal -> the host's gateway IP. Lets the app
      # connect to the host-installed MongoDB at host.docker.internal:27017.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent browser profiles (cookies + local storage). Survives deploys.
      - ./volumes/profiles:/app/profiles
    networks: [internal]
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy_data:/data
      - ./volumes/caddy_config:/config
    depends_on:
      - app
    networks: [internal]

networks:
  internal:
