; Supervisord config — orchestrates everything inside the app container.
;
; Process order (priority lower number = started earlier):
;   1. xvfb        — virtual display :99
;   2. fluxbox     — window manager attached to :99
;   3. x11vnc      — VNC server exposing :99 on localhost:5900
;   4. websockify  — bridges noVNC (web client at :6080) ↔ x11vnc (:5900)
;   5. app         — Node server (talks to MongoDB; launches Chrome via DISPLAY=:99)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1366x850x24 -ac +extension RANDR
user=pwuser
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
priority=20
command=/usr/bin/fluxbox
environment=DISPLAY=":99",HOME="/home/pwuser"
user=pwuser
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
priority=30
; -nopw: no VNC password (auth is enforced at Caddy via forward_auth).
; -listen 127.0.0.1: only websockify on the same container can connect.
; -shared, -forever: keep server up across viewer reconnects.
command=/usr/bin/x11vnc -display :99 -nopw -listen 127.0.0.1 -xkb -shared -forever -rfbport 5900
user=pwuser
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
priority=40
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900
user=pwuser
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
priority=50
directory=/app
command=/usr/bin/node src/server.js
environment=DISPLAY=":99",NODE_ENV="production",HOME="/home/pwuser"
user=pwuser
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
